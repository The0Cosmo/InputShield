name: Windows validation and offline package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse PowerShell sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = Get-ChildItem -Path . -Recurse -File -Filter '*.ps1'
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
            }
            Write-Host "Parsed $($script.FullName)"
          }

      - name: Validate embedded WPF XAML
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content -Raw '.\src\InputShield.App.ps1'
          $startMarker = '[xml]$xaml=@' + [char]39
          $endMarker = [char]39 + '@'
          $markerAt = $source.IndexOf($startMarker, [StringComparison]::Ordinal)
          if ($markerAt -lt 0) { throw 'Could not locate XAML start marker.' }
          $contentStart = $source.IndexOf([char]10, $markerAt) + 1
          $contentEnd = $source.IndexOf($endMarker, $contentStart, [StringComparison]::Ordinal)
          if ($contentEnd -lt $contentStart) { throw 'Could not locate XAML end marker.' }
          $xamlText = $source.Substring($contentStart, $contentEnd - $contentStart)
          $xml = New-Object System.Xml.XmlDocument
          $xml.LoadXml($xamlText)
          Write-Host 'Embedded WPF XAML is well-formed XML.'

      - name: Load WPF UI and verify named controls
        shell: powershell
        run: |
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -STA -File .\scripts\Test-WpfUI.ps1

      - name: Check offline installer payload
        shell: pwsh
        run: |
          $required = @(
            'Install-InputShield.ps1',
            'Uninstall-InputShield.ps1',
            'Install-InputShield.cmd',
            'Build-Offline-Package.ps1',
            'Install-Optional-VirtualHID.ps1',
            'src\InputShield.App.ps1',
            'src\InputShield.ps1',
            'packages\optional\README.txt'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing package file: $path" }
          }
          Write-Host 'Offline installer payload is complete.'

      - name: Build offline ZIP
        shell: powershell
        run: |
          .\Build-Offline-Package.ps1
          if (-not (Test-Path '.\release\InputShield-0.3.0-preview-Windows-x64-Offline.zip')) {
            throw 'Offline ZIP was not generated.'
          }

      - name: Upload offline package
        uses: actions/upload-artifact@v4
        with:
          name: InputShield-0.3.0-preview-Windows-x64-Offline
          path: |
            release/InputShield-0.3.0-preview-Windows-x64-Offline.zip
            release/InputShield-0.3.0-preview-Windows-x64-Offline.zip.sha256
          if-no-files-found: error
          retention-days: 30
